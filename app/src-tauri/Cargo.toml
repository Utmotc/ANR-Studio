[package]
name = "anr-studio"
version = "0.3.0"
description = "ANR Studio - 非官方 ANR 管理工具"
authors = ["ANR Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "anr_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "brotli", "deflate"] }
zip = "2.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
winreg = "0.52"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
